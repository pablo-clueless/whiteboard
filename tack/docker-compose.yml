# Dev database. `docker compose up -d postgres`, then `cargo run`.
name: tack

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tack
      POSTGRES_PASSWORD: tack
      POSTGRES_DB: tack
    # 5434 so it doesn't collide with other local Postgres instances on 5432/5433.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tack-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tack -d tack"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tack-pg:
